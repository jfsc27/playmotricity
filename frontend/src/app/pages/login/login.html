<main class="login">
  <form class="card" [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <h1>PlayMotricity</h1>
    <p class="subtitulo">Inicia sesión para continuar</p>

    <label for="correo">Correo</label>
    <input id="correo" type="email" formControlName="correo" autocomplete="username" />
    @if (form.controls.correo.touched && form.controls.correo.invalid) {
      <small class="error">Ingresa un correo válido</small>
    }

    <label for="password">Contraseña</label>
    <input id="password" type="password" formControlName="password" autocomplete="current-password" />
    @if (form.controls.password.touched && form.controls.password.invalid) {
      <small class="error">La contraseña es obligatoria</small>
    }

    @if (error()) {
      <p class="error alerta" role="alert">{{ error() }}</p>
    }

    <button type="submit" [disabled]="cargando()">
      {{ cargando() ? 'Ingresando...' : 'Iniciar sesión' }}
    </button>
  </form>
</main>
