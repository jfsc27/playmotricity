services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: playmotricity-backend

    environment:
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

    expose:
      - "8080"

    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: playmotricity-frontend

    ports:
      - "80:80"

    depends_on:
      - backend

    restart: unless-stopped
