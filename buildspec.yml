version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto21
      nodejs: 24

  pre_build:
    commands:
      - echo "Instalando dependencias del frontend..."
      - cd frontend
      - npm ci
      - cd ..

  build:
    commands:
      - echo "Compilando backend..."
      - mvn -f backend/pom.xml clean package -DskipTests
      - echo "Compilando frontend..."
      - cd frontend
      - npm run build
      - cd ..

  post_build:
    commands:
      - echo "Build de PlayMotricity completado"
      - rm -rf backend/target
      - rm -rf frontend/node_modules
      - rm -rf frontend/dist

artifacts:
  files:
    - '**/*'