version: 0.0
os: linux

files:
  - source: /
    destination: /opt/playmotricity

file_exists_behavior: OVERWRITE

hooks:
  AfterInstall:
    - location: scripts/deploy.sh
      timeout: 1800
      runas: root

  ValidateService:
    - location: scripts/validate.sh
      timeout: 180
      runas: root